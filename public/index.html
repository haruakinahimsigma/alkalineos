<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101512">
<title>Alkaline OS</title>
<style>
:root{--accent:#a8ef78;--glass:rgba(20,25,28,.78);--stroke:rgba(255,255,255,.17);--text:#f7f7f8;--muted:#c1c5cc;--wall1:#1d473b;--wall2:#0c1425}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;color:var(--text);background:#101512}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#desktop{position:fixed;inset:0;background:radial-gradient(ellipse at 20% 15%,#4d8972 0,transparent 34%),radial-gradient(ellipse at 80% 20%,#364c7d 0,transparent 35%),radial-gradient(ellipse at 65% 90%,#a15b54 0,transparent 36%),linear-gradient(135deg,var(--wall1),var(--wall2));background-size:cover;overflow:hidden}
#desktop:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 25%,rgba(255,255,255,.07) 46%,transparent 68%);mix-blend-mode:screen}
#menubar{height:34px;position:absolute;z-index:5000;top:0;left:0;right:0;display:flex;align-items:center;gap:15px;padding:0 15px;background:rgba(15,18,22,.47);backdrop-filter:blur(28px);border-bottom:1px solid #ffffff17;font-size:12px}
.menu-brand{font-weight:800;letter-spacing:-.5px}.menu-item{cursor:pointer;opacity:.9}.menu-item:hover{opacity:1}.menu-spacer{flex:1}.status{white-space:nowrap;color:#f4f4f6}.menubtn{background:transparent;border:0;padding:3px 5px;border-radius:5px}.menubtn:hover{background:#ffffff20}
#desktop-icons{position:absolute;right:18px;top:52px;display:flex;flex-direction:column;gap:16px;width:86px;z-index:2}.desktop-icon{border:0;background:transparent;border-radius:10px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:5px;text-shadow:0 1px 5px #000;overflow-wrap:anywhere}.desktop-icon:hover,.desktop-icon:focus{background:#ffffff20}.desk-glyph{font-size:34px;filter:drop-shadow(0 4px 6px #0004)}.desktop-icon span:last-child{font-size:11px;text-align:center}
#windows{position:absolute;inset:34px 0 0;z-index:10;pointer-events:none}.window{position:absolute;pointer-events:auto;min-width:290px;min-height:180px;width:min(700px,calc(100vw - 30px));height:min(480px,calc(100vh - 110px));left:50%;top:48%;transform:translate(-50%,-50%);background:rgba(25,28,32,.91);backdrop-filter:blur(32px) saturate(1.25);border:1px solid #ffffff30;border-radius:13px;box-shadow:0 25px 80px #0006,0 2px 8px #0003;overflow:hidden;display:flex;flex-direction:column;resize:both}.window.hidden{display:none}.window.maximized{left:8px!important;top:40px!important;width:calc(100vw - 16px)!important;height:calc(100vh - 122px)!important;transform:none!important;resize:none}.titlebar{height:42px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 13px;background:#ffffff08;border-bottom:1px solid #ffffff14;cursor:grab;user-select:none}.titlebar:active{cursor:grabbing}.traffic{display:flex;gap:7px}.traffic button{width:12px;height:12px;border:0;border-radius:50%;padding:0;box-shadow:inset 0 0 0 1px #0002}.close{background:#ff6058}.minimize{background:#ffbd2e}.zoom{background:#28c840}.window-title{font-weight:650;font-size:12px;flex:1;text-align:center;margin-right:48px}.window-content{padding:17px;overflow:auto;flex:1;min-height:0}.window-content.no-pad{padding:0}.app-toolbar{display:flex;gap:8px;align-items:center;padding:10px 13px;border-bottom:1px solid #ffffff15}.app-toolbar button,.soft-button{border:1px solid #ffffff20;background:#ffffff0d;border-radius:7px;padding:6px 10px}.app-toolbar button:hover,.soft-button:hover{background:#ffffff1d}.primary{background:var(--accent)!important;color:#162017!important;border-color:transparent!important;font-weight:700}.muted{color:var(--muted)}.small{font-size:12px}.field{background:#0b0e11a8;border:1px solid #ffffff23;border-radius:8px;color:var(--text);padding:9px 11px;min-width:0}.field::placeholder{color:#9da4ad}.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#aab2bb;font-weight:750;margin:16px 0 8px}.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}.app-tile{background:#ffffff08;border:1px solid #ffffff12;border-radius:12px;padding:15px 8px;display:flex;align-items:center;flex-direction:column;gap:8px}.app-tile:hover{background:#ffffff18}.app-tile .glyph{font-size:33px}.finder{display:flex;height:100%;min-height:0}.sidebar{width:165px;flex-shrink:0;background:#1115197a;border-right:1px solid #ffffff14;padding:14px 8px}.side-item{display:flex;gap:9px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:7px;padding:7px 9px;color:#d9dce0}.side-item.active,.side-item:hover{background:#ffffff19}.finder-main{flex:1;min-width:0;padding:16px;overflow:auto}.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(85px,1fr));gap:10px}.file-item{border:1px solid transparent;border-radius:9px;background:transparent;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}.file-item:hover,.file-item.selected{background:#ffffff15;border-color:#ffffff20}.file-item .glyph{font-size:34px}.file-item .filename{font-size:11px;text-align:center;max-width:100%;overflow-wrap:anywhere}.notes-layout{display:flex;height:100%;min-height:0}.notes-list{width:175px;border-right:1px solid #ffffff16;padding:10px;overflow:auto}.note-entry{display:block;width:100%;border:0;border-radius:8px;background:transparent;text-align:left;padding:9px;margin-bottom:4px}.note-entry.active,.note-entry:hover{background:#ffffff17}.note-editor{flex:1;display:flex;flex-direction:column;padding:14px;min-width:0}.note-editor input{font-size:20px;font-weight:700;background:transparent;border:0;color:var(--text);padding:6px 0}.note-editor textarea{resize:none;flex:1;background:transparent;border:0;color:var(--text);line-height:1.7;padding:10px 0;outline:none}.calc{max-width:340px;margin:0 auto}.calc-display{width:100%;height:92px;background:transparent;border:0;color:white;text-align:right;font-size:42px;padding:12px 8px}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calc-grid button{height:53px;border:0;border-radius:12px;background:#ffffff18;font-size:18px}.calc-grid button:hover{filter:brightness(1.2)}.calc-grid .op{background:#ffffff30}.calc-grid .equals{background:var(--accent);color:#182018}.terminal{height:100%;background:#080b0a;padding:14px;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;flex-direction:column}.term-output{flex:1;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}.term-line{display:flex;gap:8px}.term-prompt{color:var(--accent);white-space:nowrap}.term-input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:#f1f6f2;font:inherit}.settings-layout{display:grid;grid-template-columns:155px 1fr;gap:18px}.setting-card{background:#ffffff08;border:1px solid #ffffff14;border-radius:12px;padding:13px;margin-bottom:12px}.swatches{display:flex;gap:10px;flex-wrap:wrap}.swatch{width:62px;height:48px;border:2px solid transparent;border-radius:9px}.swatch.active{border-color:white;box-shadow:0 0 0 2px #0005}.dock-wrap{position:absolute;z-index:4500;bottom:12px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 20px);padding:6px 8px 8px;border:1px solid #ffffff35;border-radius:20px;background:rgba(30,32,37,.45);backdrop-filter:blur(32px) saturate(1.6);box-shadow:0 8px 35px #0004}.dock{display:flex;align-items:end;gap:7px}.dock-app{position:relative;border:0;background:transparent;border-radius:12px;width:52px;height:52px;padding:3px;display:grid;place-items:center;transition:transform .15s}.dock-app:hover{transform:translateY(-8px) scale(1.08)}.dock-app .glyph{font-size:34px;filter:drop-shadow(0 3px 3px #0005)}.dock-app .dot{position:absolute;bottom:-3px;width:4px;height:4px;border-radius:50%;background:white}.dock-divider{height:40px;border-left:1px solid #ffffff55;margin:0 3px}.tooltip{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);background:#202329;color:white;padding:5px 8px;border-radius:6px;white-space:nowrap;font-size:11px;opacity:0;pointer-events:none}.dock-app:hover .tooltip{opacity:1}#context{position:absolute;z-index:6000;display:none;min-width:170px;padding:6px;background:#202329f2;backdrop-filter:blur(20px);border:1px solid #ffffff2b;border-radius:9px;box-shadow:0 12px 35px #0005}#context button{display:block;width:100%;text-align:left;border:0;border-radius:5px;background:transparent;padding:8px 10px;font-size:12px}#context button:hover{background:#ffffff18}.toast{position:absolute;z-index:7000;top:47px;left:50%;transform:translateX(-50%);background:#202329eb;border:1px solid #ffffff2a;border-radius:10px;padding:9px 15px;box-shadow:0 5px 20px #0004;animation:fade 2.8s forwards;pointer-events:none}@keyframes fade{0%,75%{opacity:1}100%{opacity:0}}.boot-panel{font-family:ui-monospace,monospace;background:#050806;border-radius:9px;padding:16px;color:#c6f8b2;min-height:180px;white-space:pre-wrap}.wallpaper-choice{height:90px;border-radius:10px;border:2px solid transparent}.wallpaper-choice.active{border-color:white}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:#ffffff13;color:#d9e0db;font-size:11px}.empty{text-align:center;padding:34px 12px;color:var(--muted)}@media(max-width:600px){#menubar{gap:8px;padding:0 9px}.hide-mobile{display:none!important}#desktop-icons{right:6px;top:45px}.dock-app{width:43px;height:46px}.dock-app .glyph{font-size:29px}.dock{gap:3px}.window{min-width:0;width:calc(100vw - 12px);height:calc(100vh - 106px);max-height:calc(100vh - 100px)}.window.maximized{left:4px!important;width:calc(100vw - 8px)!important;height:calc(100vh - 112px)!important}.sidebar{width:115px}.notes-list{width:120px}.settings-layout{grid-template-columns:1fr}.settings-layout .sidebar{display:none}.calc-grid button{height:48px}}
</style>
</head>
<body>
<div id="desktop" aria-label="Alkaline OS desktop">
 <div id="menubar">
  <button class="menubtn menu-brand" onclick="openApp('about')" aria-label="About Alkaline">◈ Alkaline</button>
  <button class="menubtn menu-item hide-mobile" onclick="openApp('finder')">File</button><button class="menubtn menu-item hide-mobile" onclick="openApp('notes')">Edit</button><button class="menubtn menu-item hide-mobile" onclick="openApp('settings')">View</button>
  <span class="menu-spacer"></span><span class="status hide-mobile" id="menustate">● All systems ready</span><button class="menubtn status" onclick="openApp('control')" title="Control Center">◉</button><button class="menubtn status" onclick="openApp('settings')" title="Settings">⚙</button><span class="status" id="clock">--:--</span>
 </div>
 <div id="desktop-icons">
  <button class="desktop-icon" ondblclick="openApp('finder')" onclick="selectDesk(this)"><span class="desk-glyph">💾</span><span>Home</span></button>
  <button class="desktop-icon" ondblclick="openApp('kernel')" onclick="selectDesk(this)"><span class="desk-glyph">🖥️</span><span>Kernel Lab</span></button>
  <button class="desktop-icon" ondblclick="openApp('notes')" onclick="selectDesk(this)"><span class="desk-glyph">📝</span><span>Quick Note</span></button>
 </div>
 <div id="windows"></div>
 <div class="dock-wrap"><div class="dock" id="dock"></div></div>
 <div id="context"></div>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const APPS=[
 {id:'finder',name:'Finder',icon:'🗂️'},{id:'notes',name:'Notes',icon:'📝'},{id:'calculator',name:'Calculator',icon:'🧮'},{id:'terminal',name:'Terminal',icon:'⌘'},{id:'settings',name:'Settings',icon:'⚙️'},{id:'browser',name:'Browser',icon:'🌐'},{id:'kernel',name:'Kernel Lab',icon:'🖥️'},{id:'about',name:'About Alkaline',icon:'◈'}
];
let z=20,active='finder',noteId=null,calcValue='0',calcFirst=null,calcOp=null,calcFresh=false,currentFolder='Home',selectedFile=null;
const store={
 get(k,fallback){try{const v=localStorage.getItem('alkaline:'+k);return v===null?fallback:JSON.parse(v)}catch(e){return fallback}},
 set(k,v){try{localStorage.setItem('alkaline:'+k,JSON.stringify(v));return true}catch(e){toast('Could not save: storage may be full');return false}}
};
let files=store.get('files',[
 {id:'welcome',name:'Welcome.txt',type:'file',folder:'Home',content:'Welcome to Alkaline OS!\\n\\nThis is your browser desktop. Files and notes are saved in this browser using local storage.\\n\\nTry the Terminal app: help, ls, date, whoami, cat Welcome.txt'},
 {id:'projects',name:'Projects',type:'folder',folder:'Home',content:''},
 {id:'kernel',name:'Kernel',type:'folder',folder:'Home',content:''},
 {id:'roadmap',name:'Roadmap.txt',type:'file',folder:'Kernel',content:'ALKALINE OS ROADMAP\\n\\n1. Boot sector starter committed\\n2. Second-stage loader\\n3. Freestanding kernel\\n4. Memory manager and interrupts\\n5. Keyboard, shell, filesystem\\n6. Graphics and applications'}
]);
let notes=store.get('notes',[{id:'note-welcome',title:'Welcome to Alkaline Notes',body:'Your notes save automatically in this browser.\\n\\nMake something cool. 🚀',updated:Date.now()}]);
function saveFiles(){store.set('files',files)}function saveNotes(){store.set('notes',notes)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(message){const el=document.createElement('div');el.className='toast';el.textContent=message;$('desktop').appendChild(el);setTimeout(()=>el.remove(),2900)}
function updateClock(){const d=new Date();$('clock').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});$('menustate').textContent='● '+d.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'})}
setInterval(updateClock,1000);updateClock();
function buildDock(){const dock=$('dock');dock.innerHTML='';APPS.forEach((a,i)=>{if(i===6){const div=document.createElement('div');div.className='dock-divider';dock.appendChild(div)}const b=document.createElement('button');b.className='dock-app';b.setAttribute('aria-label',a.name);b.innerHTML='<span class="glyph">'+a.icon+'</span><span class="tooltip">'+a.name+'</span>';b.onclick=()=>openApp(a.id);b.id='dock-'+a.id;dock.appendChild(b)})}
buildDock();
function windowHTML(id,title,body){return '<section class="window" id="win-'+id+'" data-app="'+id+'" style="z-index:'+(++z)+'"><div class="titlebar" onmousedown="startDrag(event,\\''+id+'\\')"><div class="traffic"><button class="close" title="Close" onclick="closeApp(\\''+id+'\\')"></button><button class="minimize" title="Minimize" onclick="minimizeApp(\\''+id+'\\')"></button><button class="zoom" title="Maximize/restore" onclick="maximizeApp(\\''+id+'\\')"></button></div><div class="window-title">'+title+'</div></div><div class="window-content" id="content-'+id+'">'+body+'</div></section>'}
function appBody(id){
 if(id==='finder')return finderHTML();
 if(id==='notes')return notesHTML();
 if(id==='calculator')return calcHTML();
 if(id==='terminal')return terminalHTML();
 if(id==='settings')return settingsHTML();
 if(id==='browser')return browserHTML();
 if(id==='kernel')return kernelHTML();
 if(id==='about')return aboutHTML();
 if(id==='control')return controlHTML();
 return '<p>App not found.</p>';
}
function openApp(id){if(id==='control'){const old=$('win-control');if(old){old.remove()}$('windows').insertAdjacentHTML('beforeend',windowHTML('control','Control Center',appBody('control')));const w=$('win-control');w.style.width='320px';w.style.height='360px';w.style.left='auto';w.style.right='18px';w.style.top='42px';w.style.transform='none';focusWin('control');return}
 let w=$('win-'+id);if(w){w.classList.remove('hidden');w.style.zIndex=++z;active=id;markDock(id);return}
 const app=APPS.find(a=>a.id===id);if(!app)return;
 $('windows').insertAdjacentHTML('beforeend',windowHTML(id,app.name,appBody(id)));w=$('win-'+id);w.addEventListener('mousedown',()=>focusWin(id));active=id;markDock(id);if(id==='terminal')setTimeout(()=>{const inp=$('term-input');if(inp)inp.focus()},80);
}
function focusWin(id){const w=$('win-'+id);if(w){w.style.zIndex=++z;active=id;markDock(id)}}
function markDock(id){APPS.forEach(a=>{const b=$('dock-'+a.id);if(!b)return;const w=$('win-'+a.id);let dot=b.querySelector('.dot');if(w&&!w.classList.contains('hidden')){if(!dot){dot=document.createElement('span');dot.className='dot';b.appendChild(dot)}}else if(dot)dot.remove()})}
function closeApp(id){const w=$('win-'+id);if(w)w.remove();markDock(id)}
function minimizeApp(id){const w=$('win-'+id);if(w)w.classList.add('hidden');markDock(id)}
function maximizeApp(id){const w=$('win-'+id);if(w)w.classList.toggle('maximized')}
window.openApp=openApp;window.closeApp=closeApp;window.minimizeApp=minimizeApp;window.maximizeApp=maximizeApp;
let drag=null;
window.startDrag=(e,id)=>{if(e.target.tagName==='BUTTON')return;const w=$('win-'+id);if(!w||w.classList.contains('maximized'))return;focusWin(id);const r=w.getBoundingClientRect();drag={id,x:e.clientX,y:e.clientY,left:r.left,top:r.top};document.addEventListener('mousemove',moveDrag);document.addEventListener('mouseup',stopDrag,{once:true})};
function moveDrag(e){if(!drag)return;const w=$('win-'+drag.id);if(!w)return;w.style.left=(drag.left+e.clientX-drag.x)+'px';w.style.top=Math.max(34,drag.top+e.clientY-drag.y)+'px';w.style.transform='none'}
function stopDrag(){drag=null;document.removeEventListener('mousemove',moveDrag)}
window.selectDesk=el=>{document.querySelectorAll('.desktop-icon').forEach(x=>x.style.background='');el.style.background='#ffffff20'};
function finderHTML(){const entries=files.filter(f=>f.folder===currentFolder);return '<div class="app-toolbar"><button onclick="finderBack()">← Back</button><strong id="folder-label">'+esc(currentFolder)+'</strong><span class="grow"></span><button onclick="newFile()">＋ New file</button><button onclick="newFolder()">＋ Folder</button></div><div class="finder"><aside class="sidebar"><div class="section-title">Favorites</div><button class="side-item '+(currentFolder==='Home'?'active':'')+'" onclick="changeFolder(\\'Home\\')">🏠 Home</button><button class="side-item '+(currentFolder==='Projects'?'active':'')+'" onclick="changeFolder(\\'Projects\\')">📁 Projects</button><button class="side-item '+(currentFolder==='Kernel'?'active':'')+'" onclick="changeFolder(\\'Kernel\\')">🖥️ Kernel</button><div class="section-title">Actions</div><button class="side-item" onclick="importTextFile()">↥ Import text</button><button class="side-item" onclick="exportFiles()">↧ Export files</button></aside><div class="finder-main"><div class="file-grid" id="file-grid">'+entries.map(f=>'<button class="file-item" onclick="selectFile(\\''+f.id+'\\')" ondblclick="activateFile(\\''+f.id+'\\')"><span class="glyph">'+(f.type==='folder'?'📁':(f.name.endsWith('.txt')?'📄':'🗒️'))+'</span><span class="filename">'+esc(f.name)+'</span></button>').join('')+'</div><div class="muted small" style="margin-top:20px">'+entries.length+' items · Saved in this browser</div></div></div>'}
window.changeFolder=name=>{currentFolder=name;refreshApp('finder')};window.finderBack=()=>changeFolder('Home');
window.selectFile=id=>{selectedFile=id;document.querySelectorAll('.file-item').forEach(b=>b.classList.toggle('selected',b.getAttribute('onclick')==="selectFile('"+id+"')"))};
window.activateFile=id=>{const f=files.find(x=>x.id===id);if(!f)return;if(f.type==='folder'){currentFolder=f.name;refreshApp('finder')}else openFile(id)};
function openFile(id){const f=files.find(x=>x.id===id);if(!f)return;openApp('notes');if(f.name.toLowerCase().includes('roadmap')){let n=notes.find(x=>x.id==='note-roadmap');if(!n){n={id:'note-roadmap',title:f.name,body:f.content,updated:Date.now()};notes.push(n);saveNotes()}noteId=n.id;refreshApp('notes')}else{let n=notes.find(x=>x.id==='file-'+id);if(!n){n={id:'file-'+id,title:f.name,body:f.content,updated:Date.now()};notes.push(n);saveNotes()}noteId=n.id;refreshApp('notes')}}
window.newFile=()=>{const name=prompt('New file name','Untitled.txt');if(!name)return;files.push({id:'f-'+Date.now(),name:name,type:'file',folder:currentFolder,content:''});saveFiles();refreshApp('finder');toast('File created')};
window.newFolder=()=>{const name=prompt('New folder name','New Folder');if(!name)return;if(files.some(f=>f.name===name)){toast('That name already exists');return}files.push({id:'d-'+Date.now(),name:name,type:'folder',folder:currentFolder,content:''});saveFiles();refreshApp('finder');toast('Folder created')};
window.importTextFile=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='.txt,.md,.json,.csv,text/plain,text/markdown,application/json,text/csv';inp.onchange=()=>{const file=inp.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{files.push({id:'import-'+Date.now(),name:file.name,type:'file',folder:currentFolder,content:String(reader.result)});saveFiles();refreshApp('finder');toast('Imported '+file.name)};reader.readAsText(file)};inp.click()};
window.exportFiles=()=>{const blob=new Blob([JSON.stringify(files,null,2)],{type:'application/json'});downloadBlob(blob,'alkaline-files.json')};
function notesHTML(){if(!notes.length)notes.push({id:'note-'+Date.now(),title:'New Note',body:'',updated:Date.now()});if(!noteId||!notes.some(n=>n.id===noteId))noteId=notes[0].id;const n=notes.find(x=>x.id===noteId);return '<div class="notes-layout"><aside class="notes-list"><button class="soft-button" style="width:100%;margin-bottom:10px" onclick="addNote()">＋ New note</button>'+notes.slice().sort((a,b)=>b.updated-a.updated).map(x=>'<button class="note-entry '+(x.id===noteId?'active':'')+'" onclick="chooseNote(\\''+x.id+'\\')"><strong style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(x.title||'Untitled')+'</strong><span class="muted small">'+esc((x.body||'').slice(0,40)||'Empty note')+'</span></button>').join('')+'</aside><div class="note-editor"><input id="note-title" value="'+esc(n.title)+'" placeholder="Untitled" oninput="saveCurrentNote()"><div class="muted small" id="note-status">Saved locally</div><textarea id="note-body" placeholder="Start typing..." oninput="saveCurrentNote()">'+esc(n.body)+'</textarea><div class="row"><button class="soft-button" onclick="deleteNote()">Delete note</button><span class="grow"></span><button class="soft-button" onclick="downloadCurrentNote()">Export .txt</button></div></div></div>'}
window.chooseNote=id=>{noteId=id;refreshApp('notes')};window.addNote=()=>{const n={id:'note-'+Date.now(),title:'Untitled',body:'',updated:Date.now()};notes.push(n);noteId=n.id;saveNotes();refreshApp('notes');setTimeout(()=>$('note-title')?.focus(),20)};
let noteSaveTimer=null;window.saveCurrentNote=()=>{const n=notes.find(x=>x.id===noteId);if(!n)return;n.title=$('note-title')?.value||'';n.body=$('note-body')?.value||'';n.updated=Date.now();saveNotes();const status=$('note-status');if(status)status.textContent='Saving…';clearTimeout(noteSaveTimer);noteSaveTimer=setTimeout(()=>{if($('note-status'))$('note-status').textContent='Saved locally ✓';const list=$('content-notes')?.querySelector('.notes-list');if(list){const y=list.scrollTop;list.innerHTML='<button class="soft-button" style="width:100%;margin-bottom:10px" onclick="addNote()">＋ New note</button>'+notes.slice().sort((a,b)=>b.updated-a.updated).map(x=>'<button class="note-entry '+(x.id===noteId?'active':'')+'" onclick="chooseNote(\\''+x.id+'\\')"><strong style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(x.title||'Untitled')+'</strong><span class="muted small">'+esc((x.body||'').slice(0,40)||'Empty note')+'</span></button>').join('');list.scrollTop=y}},450)};
window.deleteNote=()=>{if(!confirm('Delete this note?'))return;notes=notes.filter(n=>n.id!==noteId);noteId=notes[0]?.id||null;saveNotes();refreshApp('notes')};
window.downloadCurrentNote=()=>{const n=notes.find(x=>x.id===noteId);if(n)downloadBlob(new Blob([n.body],{type:'text/plain;charset=utf-8'}),(n.title||'note').replace(/[^a-z0-9-_ ]/gi,'_')+'.txt')};
function calcHTML(){return '<div class="calc"><input class="calc-display" id="calc-display" value="'+esc(calcValue)+'" readonly aria-label="Calculator display"><div class="calc-grid">'+[['AC','±','%','÷'],['7','8','9','×'],['4','5','6','−'],['1','2','3','+'],['0','.','⌫','=']].map(row=>row.map(x=>'<button class="'+(['÷','×','−','+'].includes(x)?'op ':'')+(x==='='?'equals':'')+'" onclick="calcPress(\\''+x+'\\')">'+x+'</button>').join('')).join('')+'</div></div>'}
window.calcPress=x=>{if(x==='AC'){calcValue='0';calcFirst=null;calcOp=null;calcFresh=false}else if(x==='⌫'){calcValue=calcValue.length>1?calcValue.slice(0,-1):'0'}else if(x==='±'){calcValue=String(-Number(calcValue))}else if(x==='%'){calcValue=String(Number(calcValue)/100)}else if(['+','−','×','÷'].includes(x)){calcFirst=Number(calcValue);calcOp=x;calcFresh=true}else if(x==='='){if(calcOp!==null&&calcFirst!==null){const b=Number(calcValue);let out=calcOp==='+'?calcFirst+b:calcOp==='−'?calcFirst-b:calcOp==='×'?calcFirst*b:calcFirst/b;calcValue=String(Number.isFinite(out)?Number(out.toPrecision(10)):'Error');calcFirst=null;calcOp=null;calcFresh=true}}else if(x==='.'){if(calcFresh){calcValue='0.';calcFresh=false}else if(!calcValue.includes('.'))calcValue+='.'}else{if(calcFresh||calcValue==='0'||calcValue==='Error'){calcValue=x;calcFresh=false}else if(calcValue.length<14)calcValue+=x}const d=$('calc-display');if(d)d.value=calcValue};
function terminalHTML(){return '<div class="terminal"><div class="term-output" id="term-output">Alkaline Terminal 0.1.0\\nA friendly command line for your browser desktop. Type <b>help</b> to see commands.\\n\\n</div><form class="term-line" id="term-form"><span class="term-prompt">guest@alkaline ~ %</span><input id="term-input" class="term-input" autocomplete="off" spellcheck="false" aria-label="Terminal command"></form></div>'}
function terminalPrint(s){const out=$('term-output');if(out){out.textContent+=s+'\\n';out.scrollTop=out.scrollHeight}}
function runCommand(raw){const out=$('term-output');if(!out)return;const cmd=raw.trim();terminalPrint('guest@alkaline ~ % '+cmd);if(!cmd)return;const parts=cmd.split(' '),base=parts[0],arg=parts.slice(1).join(' ');
if(base==='help')terminalPrint('help        show commands\\nclear       clear terminal\\ndate        show local date and time\\nwhoami      current browser user\\npwd         current virtual folder\\nls          list virtual files\\ncat NAME   print a text file\\necho TEXT  print text\\nopen APP   launch an app (finder, notes, calculator, settings, browser, kernel)\\nabout       system info');
else if(base==='clear')out.textContent='';
else if(base==='date')terminalPrint(new Date().toString());
else if(base==='whoami')terminalPrint('guest (local browser session)');
else if(base==='pwd')terminalPrint('/Users/guest/'+currentFolder);
else if(base==='ls')terminalPrint(files.filter(f=>f.folder===currentFolder).map(f=>(f.type==='folder'?'📁 ':'   ')+f.name).join('\\n')||'(empty)');
else if(base==='cat'){const f=files.find(f=>f.name===arg);if(f)terminalPrint(f.content||'(empty file)');else terminalPrint('cat: '+arg+': file not found')}
else if(base==='echo')terminalPrint(arg);
else if(base==='about')terminalPrint('Alkaline OS Web Desktop\\nVersion 0.1.0 · Browser environment\\nKernel status: source starter only; not running in this page.');
else if(base==='open'){const aliases={files:'finder',file:'finder',calc:'calculator',prefs:'settings'};const id=aliases[arg]||arg;if(APPS.some(a=>a.id===id))openApp(id);else terminalPrint('open: unknown app "'+arg+'"')}
else terminalPrint('command not found: '+base+' (try help)')}
document.addEventListener('submit',e=>{if(e.target.id==='term-form'){e.preventDefault();const inp=$('term-input');const cmd=inp.value;inp.value='';runCommand(cmd)}});
function settingsHTML(){const accent=store.get('accent','#a8ef78');const wall=store.get('wall','green');const walls=[['green','Aurora','#1d473b','#0c1425'],['sunset','Sunset','#9b4b5c','#211a43'],['ocean','Ocean','#176f83','#111c45'],['graphite','Graphite','#555861','#17191f']];return '<div class="settings-layout"><aside><div class="section-title">System Settings</div><button class="side-item active">🎨 Appearance</button><button class="side-item" onclick="openApp(\\'about\\')">◈ About</button><button class="side-item" onclick="openApp(\\'kernel\\')">🖥️ Kernel</button></aside><div><h2 style="margin-top:0">Appearance</h2><p class="muted">Make this desktop yours.</p><div class="setting-card"><strong>Wallpaper</strong><div class="swatches" style="margin-top:12px">'+walls.map(w=>'<button title="'+w[1]+'" class="wallpaper-choice '+(wall===w[0]?'active':'')+'" style="width:calc(50% - 5px);background:radial-gradient(circle at 30% 20%,'+w[2]+','+w[3]+')" onclick="setWall(\\''+w[0]+'\\')"></button>').join('')+'</div><div class="muted small">Choose a desktop color theme</div></div><div class="setting-card"><strong>Accent color</strong><div class="swatches" style="margin-top:12px">'+['#a8ef78','#7dd3fc','#f9a8d4','#fbbf24','#c4b5fd'].map(c=>'<button class="swatch" style="background:'+c+'" onclick="setAccent(\\''+c+'\\')" aria-label="Set accent '+c+'"></button>').join('')+'</div></div><div class="setting-card"><strong>Storage</strong><p class="muted small">Files and notes are saved locally in this browser. Clearing browser site data can remove them.</p><button class="soft-button" onclick="exportAll()">Export all data</button> <button class="soft-button" onclick="resetDesktop()">Reset demo data</button></div><div class="setting-card"><strong>Desktop version</strong><p class="muted small">Alkaline Web Desktop 0.1.0 · responsive interface</p></div></div></div>'}
window.setWall=id=>{const map={green:['#1d473b','#0c1425'],sunset:['#9b4b5c','#211a43'],ocean:['#176f83','#111c45'],graphite:['#555861','#17191f']};store.set('wall',id);document.documentElement.style.setProperty('--wall1',map[id][0]);document.documentElement.style.setProperty('--wall2',map[id][1]);refreshApp('settings')};
window.setAccent=c=>{store.set('accent',c);document.documentElement.style.setProperty('--accent',c);refreshApp('settings');toast('Accent updated')};
function applyPrefs(){const map={green:['#1d473b','#0c1425'],sunset:['#9b4b5c','#211a43'],ocean:['#176f83','#111c45'],graphite:['#555861','#17191f']};const w=map[store.get('wall','green')]||map.green;document.documentElement.style.setProperty('--wall1',w[0]);document.documentElement.style.setProperty('--wall2',w[1]);document.documentElement.style.setProperty('--accent',store.get('accent','#a8ef78'))}
function browserHTML(){return '<div class="app-toolbar"><span>🌐</span><form id="browser-form" class="row grow"><input id="browser-url" class="field grow" value="https://example.com" placeholder="Enter a website address"><button class="soft-button">Go</button></form></div><iframe id="browser-frame" title="Web browser" src="https://example.com" sandbox="allow-forms allow-scripts allow-same-origin allow-popups" style="width:100%;height:calc(100% - 47px);border:0;background:white"></iframe><div class="muted small" style="padding:5px 12px">Some sites block embedding. Use the open-in-new-tab button if needed.</div><button class="soft-button" style="position:absolute;right:18px;top:53px" onclick="openBrowserExternal()">↗ Open externally</button>'}
document.addEventListener('submit',e=>{if(e.target.id==='browser-form'){e.preventDefault();let url=$('browser-url').value.trim();if(!/^https?:\\/\\//i.test(url))url='https://'+url;$('browser-url').value=url;$('browser-frame').src=url}});
window.openBrowserExternal=()=>{let url=$('browser-url')?.value||'https://example.com';if(!/^https?:\\/\\//i.test(url))url='https://'+url;window.open(url,'_blank','noopener,noreferrer')};
function kernelHTML(){return '<div><div class="row" style="justify-content:space-between;flex-wrap:wrap"><div><div class="eyebrow">Developer tools</div><h2 style="margin:5px 0">Kernel Lab</h2></div><span class="pill">x86 BIOS · early stage</span></div><p class="muted">The real kernel project lives in GitHub. This browser desktop is a separate user-space environment.</p><div class="boot-panel" id="kernel-screen">ALKALINE OS BOOT CONSOLE\\n-----------------------\\nNo kernel is running in this browser window yet.\\n\\nThe repository contains a 512-byte x86 BIOS boot-sector source.\\nBuild it with NASM in a Linux workspace, then test it in QEMU.\\n\\nThis simulated panel is not an emulator.</div><div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="soft-button primary" onclick="kernelDemo()">Run UI self-check</button><button class="soft-button" onclick="window.open(\\'https://github.com/haruakinahimsigma/alkalineos\\',\\'_blank\\',\\'noopener\\')">Open source ↗</button><button class="soft-button" onclick="window.open(\\'https://github.com/haruakinahimsigma/alkalineos/blob/main/docs/NEXT_STEPS.md\\',\\'_blank\\',\\'noopener\\')">Roadmap ↗</button></div><div class="section-title">Next kernel milestones</div><ol class="muted"><li>Build and test the boot sector in QEMU</li><li>Load a second-stage bootloader</li><li>Start a freestanding kernel and serial logger</li><li>Add memory management, interrupts and input</li></ol></div>'}
window.kernelDemo=()=>{const el=$('kernel-screen');if(el)el.textContent='ALKALINE OS WEB SELF-CHECK\\n-------------------------\\n[ OK ] Desktop DOM is responding\\n[ OK ] Local storage available: '+(function(){try{localStorage.setItem('alkaline:check',1);localStorage.removeItem('alkaline:check');return 'yes'}catch(e){return 'no'}}())+'\\n[ OK ] Notes count: '+notes.length+'\\n[ OK ] Virtual files: '+files.length+'\\n[ NOTE ] This checks the web UI, not the x86 kernel.\\n\\nKernel execution requires an emulator and a built disk image.'};
function aboutHTML(){return '<div style="text-align:center;padding:20px 10px"><div style="font-size:64px;color:var(--accent)">◈</div><h1 style="margin:5px 0 0;font-size:30px">Alkaline OS</h1><p class="muted">Web Desktop · Version 0.1.0</p><p>A macOS-inspired desktop playground with working browser-side apps.</p><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));text-align:left;margin-top:20px"><div class="setting-card"><strong>Environment</strong><p class="small muted">Browser / JavaScript</p></div><div class="setting-card"><strong>Data</strong><p class="small muted">Local storage</p></div><div class="setting-card"><strong>Kernel</strong><p class="small muted">In development</p></div><div class="setting-card"><strong>License</strong><p class="small muted">Personal project</p></div></div><button class="soft-button primary" onclick="openApp(\\'kernel\\')">Open Kernel Lab</button></div>'}
function controlHTML(){return '<div><h2>Control Center</h2><p class="muted small">Quick settings</p><div class="setting-card"><strong>Appearance</strong><div class="row" style="margin-top:10px"><button class="soft-button" onclick="setWall(\\'green\\')">🌿 Aurora</button><button class="soft-button" onclick="setWall(\\'ocean\\')">🌊 Ocean</button></div></div><div class="setting-card"><strong>Quick launch</strong><div class="app-grid">'+APPS.slice(0,6).map(a=>'<button class="app-tile" onclick="openApp(\\''+a.id+'\\')"><span class="glyph">'+a.icon+'</span><span>'+a.name+'</span></button>').join('')+'</div></div></div>'}
function refreshApp(id){const w=$('win-'+id);if(!w)return;const title=w.querySelector('.window-title').textContent;const old=w.querySelector('.window-content');const noPad=old.classList.contains('no-pad');old.innerHTML=appBody(id);if(noPad)old.classList.add('no-pad')}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
window.exportAll=()=>downloadBlob(new Blob([JSON.stringify({files,notes,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),'alkaline-backup.json');
window.resetDesktop=()=>{if(!confirm('Reset the local demo files and notes? This cannot be undone.'))return;localStorage.removeItem('alkaline:files');localStorage.removeItem('alkaline:notes');files=store.get('files',[]);notes=store.get('notes',[]);toast('Reloading desktop');location.reload()};
$('desktop').addEventListener('contextmenu',e=>{if(e.target.closest('.window')||e.target.closest('#menubar')||e.target.closest('.dock-wrap'))return;e.preventDefault();const c=$('context');c.style.display='block';c.style.left=Math.min(e.clientX,innerWidth-185)+'px';c.style.top=Math.min(e.clientY,innerHeight-180)+'px';c.innerHTML='<button onclick="openApp(\\'finder\\');hideContext()">📁 New Finder window</button><button onclick="openApp(\\'notes\\');hideContext()">📝 New note</button><button onclick="openApp(\\'settings\\');hideContext()">⚙️ Desktop settings</button><button onclick="hideContext()">Cancel</button>'});
window.hideContext=()=>{$('context').style.display='none'};document.addEventListener('click',e=>{if(!e.target.closest('#context'))hideContext()});
applyPrefs();
openApp('finder');
})();
</script>
